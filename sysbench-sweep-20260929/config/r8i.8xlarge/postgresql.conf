# PG18 sysbench config for r8i.8xlarge (32 vCPU, 247.7 GiB, 1 NUMA node).
# Halved from the 16xl conf. Everything that shapes the workload (durability,
# planner costs, autovacuum, jit) is byte-identical across all boxes in the sweep;
# only memory and WAL sizing scale, and WAL:dataset is held at ~1.05.

listen_addresses = '*'
port = 5432
max_connections = 1500

shared_buffers = 64GB
effective_cache_size = 200GB

huge_pages = on
huge_page_size = 1GB

work_mem = 8MB
maintenance_work_mem = 4GB

synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
wal_buffers = 1GB
max_wal_size = 32GB
min_wal_size = 4GB
checkpoint_timeout = 30min

random_page_cost = 1.0
seq_page_cost = 1.0
effective_io_concurrency = 200

jit = off
autovacuum_max_workers = 8
bgwriter_delay = 10ms
max_locks_per_transaction = 256

logging_collector = off
log_min_messages = warning
log_destination = 'stderr'
