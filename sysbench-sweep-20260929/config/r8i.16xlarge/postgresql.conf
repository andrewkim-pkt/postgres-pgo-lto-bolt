# PG18 sysbench config for r8i.16xlarge (64 vCPU, 495.8 GiB, 1 NUMA node).
# Derived from the published 48xl pg-c.conf. Only memory-scaled knobs differ;
# everything that shapes the workload (durability, checkpointing, planner costs,
# autovacuum, jit) is byte-identical so results stay comparable across boxes.

listen_addresses = '*'
# 5432, not the 48xl's 5433: this box has no second cluster, and the us-east-2
# security group's existing PostgreSQL rule is written for 5432.
port = 5432
max_connections = 1500

# --- scaled for 495.8 GiB (48xl had 200GB / 1000GB on ~1.5 TiB) ---
shared_buffers = 128GB
effective_cache_size = 400GB

huge_pages = on
huge_page_size = 1GB

work_mem = 8MB
maintenance_work_mem = 4GB

# --- identical to the 48xl arm: these define the workload ---
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
wal_buffers = 1GB
max_wal_size = 64GB
min_wal_size = 8GB
checkpoint_timeout = 30min

random_page_cost = 1.0
seq_page_cost = 1.0
effective_io_concurrency = 200

jit = off
autovacuum_max_workers = 8
bgwriter_delay = 10ms
max_locks_per_transaction = 256

# measurement hygiene
logging_collector = off
log_min_messages = warning
log_destination = 'stderr'
